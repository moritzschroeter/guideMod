plugins {
	id 'fabric-loom' version '1.10-SNAPSHOT'
	id 'maven-publish'
	id 'java'
	id 'com.gradleup.shadow' version '9.0.0-beta10'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

// Have the include configuration extend modImplementation so that any dependencies added to modImplementation are available in include
configurations {
	include.extendsFrom(modImplementation)
}

repositories {
	mavenCentral()
}

shadowJar {
	zip64 = true
	configurations = [project.configurations.shadow]
	// Optionally, relocate packages if needed:
	//relocate 'dev.langchain4j', "${project.archives_base_name}.shaded.dev.langchain4j"
	exclude 'META-INF/accessWidener'
}




// Tell Loom’s remapJar task to use the ShadowJar output
tasks.remapJar {
	dependsOn tasks.shadowJar
	inputFile = tasks.shadowJar.archiveFile.get().asFile
	archiveFileName.set("${project.archives_base_name}-${project.version}.jar")
}



// Disable the standard jar task since we want only the shadow remapped jar
tasks.jar {
	enabled = false
}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

dependencies {
	// Standard Fabric dependencies…
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	include(implementation(annotationProcessor("io.github.llamalad7:mixinextras-fabric:0.4.1")))

	// Declare langchain4j dependencies for compilation…
	implementation "dev.langchain4j:langchain4j-ollama:1.0.0-beta1"
	implementation "dev.langchain4j:langchain4j:1.0.0-beta1"
	implementation "dev.langchain4j:langchain4j-easy-rag:1.0.0-beta1"
	implementation "dev.langchain4j:langchain4j-cohere:1.0.0-beta1"
	implementation "org.apache.opennlp:opennlp-tools:1.9.4"

	// And add them to the shadow configuration so they are bundled
	shadow "dev.langchain4j:langchain4j-ollama:1.0.0-beta1"
	shadow "dev.langchain4j:langchain4j:1.0.0-beta1"
	shadow "dev.langchain4j:langchain4j-easy-rag:1.0.0-beta1"
	shadow "dev.langchain4j:langchain4j-cohere:1.0.0-beta1"
	shadow "org.apache.opennlp:opennlp-tools:1.9.4"
}



processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}
	repositories {
		// Add your publishing repository configuration here
	}
}

loom {
	accessWidenerPath = file("src/main/resources/museumguide.accesswidener")
}
